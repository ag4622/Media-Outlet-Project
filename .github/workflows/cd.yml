name: Deploy to Amazon ECS

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed
env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: c23-abyssopelagic-dashboard-ecr
  ECS_SERVICE: c23-abyssopelagic-dashboard-service
  ECS_CLUSTER: c23-ecs-cluster

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG

          docker build -t $IMAGE --platform=linux/amd64 --provenance=false .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment